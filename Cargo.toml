[workspace]
members = ["token-service"]
resolver = "3"

[package]
name = "jira-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for Jira Cloud"
license = "MIT"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
futures = "0.3"
keyring = "3"
oauth2 = "5"
open = "5"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-textarea = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
wiremock = "0.6"
